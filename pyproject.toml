[project]
name = "raptor-desk"
version = "0.1.0"
description = "Self-hosted hackathon judging desk: DOGFOOD 2026 preloaded, signed judge records, bias-corrected rankings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "django-ninja>=1.3,<2",
  "pynacl>=1.5,<2",
  "numpy>=2.0,<3",
  "gunicorn>=23,<24",
  "whitenoise>=6.7,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "hypothesis>=6.112",
  "coverage>=7.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["tools/run.py", "src/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# Generates markdown tables and SVG: long literal lines and typographic symbols are intended.
"tools/simulate_proof.py" = ["E501", "RUF001"]
"tools/run_extended.py" = ["E501", "S310", "C901", "PLR0915", "PLR0912"]

[tool.coverage.run]
source = ["src"]
omit = ["src/*/migrations/*", "src/manage.py", "src/config/wsgi.py"]

[tool.importlinter]
root_packages = ["config", "core", "apps", "scoring_engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "scoring_engine is pure: no Django, no app code"
type = "forbidden"
source_modules = ["scoring_engine"]
forbidden_modules = ["django", "ninja", "config", "core", "apps"]

[[tool.importlinter.contracts]]
name = "core does not depend on apps or config"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["apps", "config"]
