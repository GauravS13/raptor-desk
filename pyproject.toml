[project]
name = "raptor-desk"
version = "0.1.0"
description = "Self-hosted hackathon judging desk: DOGFOOD 2026 preloaded, signed judge records, bias-corrected rankings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "django-ninja>=1.3,<2",
  "pynacl>=1.5,<2",
  "numpy>=2.0,<3",
  "gunicorn>=23,<24",
  "whitenoise>=6.7,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "hypothesis>=6.112",
  "coverage>=7.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["tools/run.py", "src/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.coverage.run]
source = ["src"]
omit = ["src/*/migrations/*", "src/manage.py", "src/config/wsgi.py"]
