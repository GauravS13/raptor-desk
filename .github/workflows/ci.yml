name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the older run, so rapid commits do not burn minutes twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Architecture contracts
        run: PYTHONPATH=src uv run lint-imports
      - name: README truth table matches the reports
        run: python3 tools/truth_table.py --check
      - name: JUDGING.md numbers match the engine
        run: uv run python tools/simulate_proof.py --check
      - run: uv run pytest

  compose:
    name: docker compose up (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for healthy portal
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Smoke test
        run: curl -fsS http://localhost:8080/healthz
      - name: Official checker and fixtures are the published files
        run: |
          echo "aa98963841bc8e18e8e5d76f0499697c093dd3c0055f9d73a459f592f4dcf09d  tools/run.py" | sha256sum -c
          echo "252896bc45d49fca69ad413be40c6bfde9d9b9f9dd8db702b3ff74eaaa181121  data/fixtures.json" | sha256sum -c
      - name: Official acceptance checker (T1, T2), identical to the committed report
        run: |
          python3 tools/run.py .dogfood.toml --fixtures data/fixtures.json > report.txt
          cat report.txt
          grep -q "verified T1 T2" report.txt
          diff -u acceptance-report.txt report.txt
      - name: Extended acceptance checker (T3, T4)
        run: |
          python3 tools/run_extended.py .dogfood-extended.toml | tee extended.txt
          grep -q "verified T3 T4" extended.txt
      - name: Logs
        if: always()
        run: docker compose logs --tail 100

  arm64:
    name: image builds on arm64
    # Emulated arm64 builds are slow, so they run on demand (Actions tab > ci > Run workflow).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for linux/arm64
        run: docker buildx build --platform linux/arm64 --tag raptor-desk:arm64 .
