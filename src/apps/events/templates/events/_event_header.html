<hgroup>
  <h1>{{ event.name }}</h1>
  <p>{{ event.get_phase_display }}{% if event.template_key %} · template {{ event.template_key }}{% endif %}</p>
</hgroup>
<nav aria-label="Event sections">
  <ul class="tabs">
    <li><a href="/o/events/{{ event.id }}" {% if tab == "overview" %}aria-current="page"{% endif %}>Overview</a></li>
    <li><a href="/o/events/{{ event.id }}/settings" {% if tab == "settings" %}aria-current="page"{% endif %}>Settings</a></li>
    <li><a href="/o/events/{{ event.id }}/rubric" {% if tab == "rubric" %}aria-current="page"{% endif %}>Rubric</a></li>
    <li><a href="/o/events/{{ event.id }}/structure" {% if tab == "structure" %}aria-current="page"{% endif %}>Tracks, prizes &amp; questions</a></li>
    <li><a href="/o/events/{{ event.id }}/people" {% if tab == "people" %}aria-current="page"{% endif %}>People</a></li>
    <li><a href="/o/events/{{ event.id }}/judging" {% if tab == "judging" %}aria-current="page"{% endif %}>Judging</a></li>
    <li><a href="/o/events/{{ event.id }}/results" {% if tab == "results" %}aria-current="page"{% endif %}>Results</a></li>
    <li><a href="/o/events/{{ event.id }}/audit" {% if tab == "audit" %}aria-current="page"{% endif %}>Audit</a></li>
    <li><a href="/o/events/{{ event.id }}/exports" {% if tab == "exports" %}aria-current="page"{% endif %}>Exports</a></li>
  </ul>
</nav>
