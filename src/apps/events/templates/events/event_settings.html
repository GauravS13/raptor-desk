{% extends "base.html" %}

{% block title %}Settings · {{ event.name }}{% endblock %}

{% block content %}
{% include "events/_event_header.html" %}
{% if form.non_field_errors %}<p class="notice error" role="alert">{{ form.non_field_errors|join:" " }}</p>{% endif %}
<form method="post" action="/o/events/{{ event.id }}/settings">
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit">Save settings</button>
</form>
{% endblock %}
