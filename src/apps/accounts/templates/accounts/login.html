{% extends "base.html" %}

{% block title %}Sign in · Raptor Desk{% endblock %}

{% block content %}
<article class="narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_email">Email</label>
    <input id="id_email" name="email" type="email" autocomplete="email" required
           value="{{ form.email.value|default_if_none:'' }}">
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p><a href="/login/email">Email me a sign-in link instead</a></p>
</article>
{% endblock %}
