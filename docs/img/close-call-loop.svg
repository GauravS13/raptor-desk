<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="ct cd">
<title id="ct">Measure, Doubt, Ask, Decide on the official DOGFOOD fixtures</title>
<desc id="cd">Bias-corrected scores and 90% bootstrap intervals for the top seven fixture projects. Five prize places are close calls. The desk asks for six extra reviews; the chances of prj_37, prj_25 and prj_16 move away from a coin flip. What is still close goes to deliberation. Numbers from JUDGING.md sections 6 and 7.</desc>

<style>
.card{fill:#ffffff;stroke:#d0d7de}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:22px;font-weight:700}.s{font-size:15px}.m{fill:#59636e}.xs{font-size:13px}
.b{font-weight:700}.grid{stroke:#d0d7de;stroke-width:1}
.pill{fill:none;stroke:#d0d7de;stroke-width:1.5}.pon{fill:#f97316}
.solid{stroke:#1f883d}.near{stroke:#ea580c}.dot{fill:#1f2328}
.hl{fill:#f97316;opacity:.16}.prize{stroke:#8250df;stroke-dasharray:6 5;stroke-width:1.5}
.pz{fill:#8250df}.pzb{fill:none;stroke:#8250df;stroke-width:1.5}.mask{fill:#ffffff}.up{fill:#1f883d}.down{fill:#cf222e}
@media (prefers-color-scheme:dark){
.card{fill:#0d1117;stroke:#30363d}text{fill:#e6edf3}.m{fill:#9198a1}.grid{stroke:#30363d}
.pill{stroke:#30363d}.solid{stroke:#3fb950}.near{stroke:#fb923c}.dot{fill:#e6edf3}
.prize{stroke:#a371f7}.pz{fill:#a371f7}.pzb{fill:none;stroke:#a371f7;stroke-width:1.5}.mask{fill:#0d1117}.up{fill:#3fb950}.down{fill:#f85149}}
.iv{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
.a-dot{animation:dot 16s infinite}
.a-iv{animation:iv 16s infinite}
.a-pr{animation:pr 16s infinite}
.a-hl{animation:hl 16s infinite}
.a-af{animation:af 16s infinite}
.p1{animation:p1 16s infinite}.p2{animation:p2 16s infinite}
.p3{animation:p3 16s infinite}.p4{animation:p4 16s infinite}
.m0{animation:hide 16s infinite}
.m1{animation:p1 16s infinite}.m2{animation:p2 16s infinite}
.m3{animation:p3 16s infinite}.m4{animation:p4 16s infinite}
}
.msg{opacity:0}.pact{opacity:0}
@media (prefers-reduced-motion:no-preference){.pact{opacity:0}}
@keyframes dot{0%,3%{opacity:0}9%,95%{opacity:1}100%{opacity:0}}
@keyframes iv{0%,24%{opacity:0;transform:scaleX(.05)}32%,95%{opacity:1;transform:scaleX(1)}100%{opacity:0}}
@keyframes pr{0%,32%{opacity:0}37%,95%{opacity:1}100%{opacity:0}}
@keyframes hl{0%,36%{opacity:0}40%{opacity:.34}44%{opacity:.1}48%{opacity:.34}53%,95%{opacity:.16}100%{opacity:0}}
@keyframes af{0%,60%{opacity:0}66%,95%{opacity:1}100%{opacity:0}}
@keyframes p1{0%,1%{opacity:0}3%,22%{opacity:1}24%,100%{opacity:0}}
@keyframes p2{0%,23%{opacity:0}25%,52%{opacity:1}54%,100%{opacity:0}}
@keyframes p3{0%,53%{opacity:0}55%,76%{opacity:1}78%,100%{opacity:0}}
@keyframes p4{0%,77%{opacity:0}79%,96%{opacity:1}98%,100%{opacity:0}}
@keyframes hide{0%,100%{opacity:0}}
</style>

<rect class="card" x="0.5" y="0.5" width="999" height="559" rx="14"/>
<text x="32" y="46" class="t">The close-call loop, on the official fixtures</text>
<rect x="32" y="66" width="134" height="32" rx="16" class="pon pact p1"/>
<rect x="32" y="66" width="134" height="32" rx="16" class="pill"/>
<text x="99" y="87" text-anchor="middle" class="s b">1  Measure</text>
<rect x="178" y="66" width="134" height="32" rx="16" class="pon pact p2"/>
<rect x="178" y="66" width="134" height="32" rx="16" class="pill"/>
<text x="245" y="87" text-anchor="middle" class="s b">2  Doubt</text>
<rect x="324" y="66" width="134" height="32" rx="16" class="pon pact p3"/>
<rect x="324" y="66" width="134" height="32" rx="16" class="pill"/>
<text x="391" y="87" text-anchor="middle" class="s b">3  Ask</text>
<rect x="470" y="66" width="134" height="32" rx="16" class="pon pact p4"/>
<rect x="470" y="66" width="134" height="32" rx="16" class="pill"/>
<text x="537" y="87" text-anchor="middle" class="s b">4  Decide</text>
<line x1="217.5" y1="150" x2="217.5" y2="450" class="grid"/>
<text x="217.5" y="142" text-anchor="middle" class="xs m">3.5</text>
<line x1="355.0" y1="150" x2="355.0" y2="450" class="grid"/>
<text x="355.0" y="142" text-anchor="middle" class="xs m">3.75</text>
<line x1="492.5" y1="150" x2="492.5" y2="450" class="grid"/>
<text x="492.5" y="142" text-anchor="middle" class="xs m">4</text>
<line x1="630.0" y1="150" x2="630.0" y2="450" class="grid"/>
<text x="630.0" y="142" text-anchor="middle" class="xs m">4.25</text>
<text x="32" y="142" class="xs m">Project</text>
<text x="790" y="142" class="xs m">Chance of a top-5 finish</text>
<rect x="20" y="242" width="960" height="36" rx="9" class="hl a-hl"/>
<rect x="20" y="284" width="960" height="36" rx="9" class="hl a-hl"/>
<rect x="20" y="326" width="960" height="36" rx="9" class="hl a-hl"/>
<rect x="20" y="368" width="960" height="36" rx="9" class="hl a-hl"/>
<rect x="20" y="410" width="960" height="36" rx="9" class="hl a-hl"/>
<line x1="20" y1="365.0" x2="980" y2="365.0" class="prize"/>
<rect x="112" y="354.0" width="136" height="22" rx="11" class="mask"/>
<rect x="112" y="354.0" width="136" height="22" rx="11" class="pzb"/>
<text x="180" y="369.5" text-anchor="middle" class="xs pz b">prize line: top 5</text>
<text x="32" y="181" class="s"><tspan class="m">1.</tspan> Iron Switch<tspan class="xs m" dx="6">prj_34</tspan></text>
<line x1="443.0" y1="176" x2="657.5" y2="176" stroke-width="5" stroke-linecap="round" class="solid iv a-iv"/>
<circle cx="548.6" cy="176" r="6.5" class="dot a-dot"/>
<text x="790" y="181" class="s a-pr"><tspan class="b">90%</tspan><tspan class="xs m" dx="8">clear of the line</tspan></text>
<text x="32" y="223" class="s"><tspan class="m">2.</tspan> Salt Ledger<tspan class="xs m" dx="6">prj_11</tspan></text>
<line x1="443.0" y1="218" x2="586.0" y2="218" stroke-width="5" stroke-linecap="round" class="solid iv a-iv"/>
<circle cx="522.2" cy="218" r="6.5" class="dot a-dot"/>
<text x="790" y="223" class="s a-pr"><tspan class="b">88%</tspan><tspan class="xs m" dx="8">clear of the line</tspan></text>
<text x="32" y="265" class="s"><tspan class="m">3.</tspan> Salt Loom<tspan class="xs m" dx="6">prj_37</tspan></text>
<line x1="234.0" y1="260" x2="718.0" y2="260" stroke-width="5" stroke-linecap="round" class="near iv a-iv"/>
<circle cx="489.7" cy="260" r="6.5" class="dot a-dot"/>
<text x="790" y="265" class="s a-pr"><tspan class="b">58%</tspan><tspan class="xs m" dx="8">close call</tspan></text>
<text x="968" y="265" text-anchor="end" class="s b a-af"><tspan class="up">→ 69%</tspan></text>
<text x="32" y="307" class="s"><tspan class="m">4.</tspan> Dry Relay<tspan class="xs m" dx="6">prj_25</tspan></text>
<line x1="283.5" y1="302" x2="613.5" y2="302" stroke-width="5" stroke-linecap="round" class="near iv a-iv"/>
<circle cx="463.9" cy="302" r="6.5" class="dot a-dot"/>
<text x="790" y="307" class="s a-pr"><tspan class="b">50%</tspan><tspan class="xs m" dx="8">close call</tspan></text>
<text x="968" y="307" text-anchor="end" class="s b a-af"><tspan class="up">→ 71%</tspan></text>
<text x="32" y="349" class="s"><tspan class="m">5.</tspan> Slow Trail<tspan class="xs m" dx="6">prj_33</tspan></text>
<line x1="371.5" y1="344" x2="509.0" y2="344" stroke-width="5" stroke-linecap="round" class="near iv a-iv"/>
<circle cx="452.9" cy="344" r="6.5" class="dot a-dot"/>
<text x="790" y="349" class="s a-pr"><tspan class="b">38%</tspan><tspan class="xs m" dx="8">close call</tspan></text>
<text x="32" y="391" class="s"><tspan class="m">6.</tspan> Salt Kiln<tspan class="xs m" dx="6">prj_16</tspan></text>
<line x1="261.5" y1="386" x2="591.5" y2="386" stroke-width="5" stroke-linecap="round" class="near iv a-iv"/>
<circle cx="445.2" cy="386" r="6.5" class="dot a-dot"/>
<text x="790" y="391" class="s a-pr"><tspan class="b">36%</tspan><tspan class="xs m" dx="8">close call</tspan></text>
<text x="968" y="391" text-anchor="end" class="s b a-af"><tspan class="down">→ 25%</tspan></text>
<text x="32" y="433" class="s"><tspan class="m">7.</tspan> Still Beacon<tspan class="xs m" dx="6">prj_10</tspan></text>
<line x1="245.0" y1="428" x2="558.5" y2="428" stroke-width="5" stroke-linecap="round" class="near iv a-iv"/>
<circle cx="392.9" cy="428" r="6.5" class="dot a-dot"/>
<text x="790" y="433" class="s a-pr"><tspan class="b">21%</tspan><tspan class="xs m" dx="8">close call</tspan></text>
<line x1="32" y1="468" x2="968" y2="468" class="grid"/>
<text x="32" y="498" class="s m0">Measure the scores, doubt the ranking, ask for the reviews that settle it, and let people decide the rest.</text>
<text x="32" y="498" class="s msg m1">Measure: a weighted rubric, then an additive model removes each judge's leniency.</text>
<text x="32" y="498" class="s msg m2">Doubt: 300 bootstrap refits. Places 3 to 7 sit between 20% and 80%: the data does not settle them.</text>
<text x="32" y="498" class="s msg m3">Ask: the desk proposes 6 extra reviews, preferring judges who already saw the neighbouring projects.</text>
<text x="32" y="498" class="s msg m4">Decide: what is still close goes to deliberation with written reasons, then is frozen and signed.</text>
<text x="32" y="530" class="xs m">Official fixtures, additive model, bootstrap &quot;90%&quot; intervals (too narrow: §8b). Numbers from JUDGING.md §6 and §7; the arrows are one demo_loop round.</text>
</svg>
