<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="t"><title id="t">Mean Spearman correlation with the true order over 200 simulated events</title><style>.card{fill:#ffffff;stroke:#d0d7de}text{font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.muted{fill:#59636e}.bar-raw{fill:#9aa5b1}.bar-shrunk_z{fill:#5b8def}.bar-additive{fill:#1f883d}.up{stroke:#1f883d}.down{stroke:#cf222e}.same{stroke:#9aa5b1}@media (prefers-color-scheme:dark){.card{fill:#0d1117;stroke:#30363d}text{fill:#e6edf3}.muted{fill:#9198a1}.bar-additive{fill:#3fb950}.up{stroke:#3fb950}.down{stroke:#f85149}.same{stroke:#6e7781}}</style><rect class="card" x="0.5" y="0.5" width="599" height="199" rx="10"/><text x="166" y="32">Mean Spearman ρ with the truth <tspan class="muted">(200 runs; higher is better)</tspan></text><text x="154" y="72" text-anchor="end">Raw mean</text><rect x="166" y="52" width="249.5" height="30" rx="3" class="bar-raw"/><text x="423.5" y="72">0.697</text><text x="154" y="120" text-anchor="end">Shrunken z</text><rect x="166" y="100" width="278.4" height="30" rx="3" class="bar-shrunk_z"/><text x="452.4" y="120">0.778</text><text x="154" y="168" text-anchor="end">Additive model</text><rect x="166" y="148" width="291.0" height="30" rx="3" class="bar-additive"/><text x="465.0" y="168">0.813</text></svg>
